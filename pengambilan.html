<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pengambilan MBG</title>
    <style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f0f4ff; color: #33415c; }

header { background: linear-gradient(135deg, #4361c4, #7299e8); color: #fff; text-align: center; padding: 38px 20px 40px; border-radius: 0 0 30px 30px; }
header h1 { margin: 0 0 10px; font-size: 2.3rem; }
header p { margin: 0; font-size: 1.05rem; }

main { max-width: 1000px; margin: 0 auto; padding: 50px 20px 60px; text-align: center; }
main h2 { margin: 0 0 14px; color: #3a56c0; font-size: 1.9rem; }
.deskripsi { margin: 0 0 30px; color: #5f6f94; }

.menu { display: flex; justify-content: center; flex-wrap: wrap; gap: 30px; }
.card { width: 318px; padding: 46px 24px 34px; background: #fff; border-radius: 18px; box-shadow: 0 6px 18px rgba(67, 97, 196, .12); }
.card h3 { margin: 0 0 14px; color: #4361c4; font-size: 1.25rem; }
.card p { margin: 0 0 26px; color: #6b7a9a; font-size: .95rem; line-height: 1.6; }

button { padding: 12px 22px; background: #4361c4; color: #fff; border: 0; border-radius: 8px; font: bold .9rem Arial, Helvetica, sans-serif; cursor: pointer; }
button:hover { background: #344fa8; }
button:disabled { opacity: .6; cursor: wait; }

.form-container { max-width: 480px; margin: 0 auto; padding: 34px 30px; background: #fff; border-radius: 18px; box-shadow: 0 6px 18px rgba(67, 97, 196, .12); text-align: left; }
.form-container h2, .form-container .deskripsi { text-align: center; }
label { display: block; margin: 16px 0 6px; font-weight: bold; font-size: .9rem; }
input, select { width: 100%; padding: 11px 12px; background: #fff; border: 1px solid #cbd5ea; border-radius: 8px; font: inherit; }
input:focus, select:focus { outline: none; border-color: #4361c4; box-shadow: 0 0 0 3px rgba(67, 97, 196, .18); }
input[type=file] { background: #f6f8ff; }
form button[type=submit] { width: 100%; margin-top: 24px; padding: 13px; }
#pesan { min-height: 1em; margin: 14px 0 0; text-align: center; font-weight: bold; }
.kembali { display: block; margin-top: 18px; text-align: center; color: #4361c4; font-weight: bold; font-size: .9rem; text-decoration: none; }

.pantau { max-width: 1100px; text-align: left; }
.pantau h2 { text-align: center; }
.pantau .deskripsi { text-align: center; }
.pantau h3 { margin: 32px 0 12px; color: #3a56c0; }
.ringkasan { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
.kartu { min-width: 210px; padding: 22px 28px; background: #fff; border-radius: 18px; box-shadow: 0 6px 18px rgba(67, 97, 196, .12); text-align: center; color: #6b7a9a; font-size: .9rem; }
.kartu b { display: block; color: #4361c4; font-size: 2.1rem; }
.filter { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.filter select, .filter input { width: auto; flex: 1 1 150px; }
.tabel-wrap { overflow-x: auto; background: #fff; border-radius: 14px; box-shadow: 0 6px 18px rgba(67, 97, 196, .12); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 11px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid #eef1fb; }
th { background: #e8eeff; color: #3a56c0; }
img.bukti { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; cursor: pointer; }
#modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .8); text-align: center; cursor: pointer; }
#modal img { max-width: 90%; max-height: 90%; margin-top: 2%; border-radius: 10px; }

footer { padding: 28px 20px; background: #263c7a; color: #fff; text-align: center; font-size: .9rem; }
footer p { margin: 0; }
</style>
</head>

<body>

<header>
    <h1>GiziKita</h1>
    <p>Sistem Pengambilan dan Pengembalian MBG</p>
</header>

<main>
    <div class="form-container">

        <h2>Form Pengambilan MBG</h2>
        <p class="deskripsi">Silakan isi data pengambilan MBG dengan benar.</p>

        <form id="formMBG" data-jenis="pengambilan">

            <label>Nama Penanggung Jawab</label>
            <input type="text" name="nama" placeholder="Masukkan nama lengkap">

            <label>Kelas</label>
            <select name="kelas">
                <option value="">-- Pilih Kelas --</option>
                <option value="X RPL 1">X RPL 1</option>
                <option value="X RPL 2">X RPL 2</option>
                <option value="X RPL 3">X RPL 3</option>
                <option value="X RPL 4">X RPL 4</option>
            </select>

            <label>Jumlah Pengambilan MBG</label>
            <input type="number" name="jumlah" min="1" placeholder="Masukkan jumlah">

            <label>Foto Bukti Pengambilan</label>
            <input type="file" name="foto" accept="image/*">

            <button type="submit">Kirim Data</button>

        </form>

        <p id="pesan"></p>

        <a href="index.html" class="kembali">Kembali ke Halaman Utama</a>

    </div>
</main>

<footer>
    <p>Dikembangkan oleh Kelompok 3</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== Config Firebase (project gizikita-3d537) =====
const firebaseConfig = {
  apiKey: "AIzaSyDBFfvpGhBEbjA4hEp6g5xgpfju86UgoAE",
  authDomain: "gizikita-3d537.firebaseapp.com",
  projectId: "gizikita-3d537",
  storageBucket: "gizikita-3d537.firebasestorage.app",
  messagingSenderId: "803004384785",
  appId: "1:803004384785:web:2082ec83d3f03fc01093b0",
  measurementId: "G-LCBBNNR5EY"
};
// =====================================================

const db = getFirestore(initializeApp(firebaseConfig));
const mbgRef = collection(db, "mbg");

const form = document.getElementById("formMBG");
const pesan = document.getElementById("pesan");
const tombol = form.querySelector("button[type=submit]");
const teksTombol = tombol.textContent;
const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

// Perkecil foto supaya muat di Firestore (batas 1 MB per data)
function kompres(file, maxSisi = 800, kualitas = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const skala = Math.min(1, maxSisi / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * skala);
      c.height = Math.round(img.height * skala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", kualitas));
    };
    img.onerror = () => reject(new Error("Foto tidak bisa dibaca"));
    img.src = url;
  });
}

function tampil(teks, ok) {
  pesan.textContent = teks;
  pesan.style.color = ok ? "green" : "red";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const nama = form.nama.value.trim();
  const kelas = form.kelas.value.trim().replace(/\s+/g, " ").toUpperCase();
  const jumlah = parseInt(form.jumlah.value, 10);
  const file = form.foto.files[0];

  if (!nama || !kelas || !jumlah || jumlah < 1 || !file) {
    return tampil("Semua data wajib diisi, termasuk foto bukti.", false);
  }
  if (firebaseConfig.apiKey.startsWith("ISI_")) {
    return tampil("Config Firebase belum diisi di file ini.", false);
  }

  tombol.disabled = true;
  tombol.textContent = "Mengirim...";
  try {
    const foto = await kompres(file);
    const sekarang = new Date();
    await addDoc(mbgRef, {
      jenis: form.dataset.jenis,
      nama, kelas, jumlah, foto,
      hari: HARI[sekarang.getDay()],
      tanggal: sekarang.toLocaleDateString("sv-SE"), // format YYYY-MM-DD
      waktu: serverTimestamp()
    });
    form.reset();
    tampil("Data berhasil dikirim.", true);
  } catch (err) {
    console.error(err);
    tampil("Gagal mengirim data. Periksa koneksi lalu coba lagi.", false);
  } finally {
    tombol.disabled = false;
    tombol.textContent = teksTombol;
  }
});
</script>

</body>
</html>
